name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(mktemp)
          missing=""
          for tag in $(git tag --list 'v*.*.0' | sort -V); do
            gh release view "$tag" >/dev/null 2>&1 && continue
            awk -v v="${tag#v}" 'index($0, "## " v " ") == 1 || $0 == "## " v {f = 1; next} /^## /{f = 0} f' \
              CHANGELOG.md | sed '/./,$!d' > "$notes"
            if [ -s "$notes" ]; then
              gh release create "$tag" --title "$tag" --notes-file "$notes"
            else
              missing="$missing $tag"
            fi
          done
          rm -f "$notes"
          [ -z "$missing" ] || { echo "CHANGELOG.md has no section for:$missing" >&2; exit 1; }
